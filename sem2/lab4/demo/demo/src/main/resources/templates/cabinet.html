<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Личный кабинет · Электронная регистратура</title>
    <link rel="icon" th:href="@{/images/icon.ico}">
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Roboto, sans-serif;
            color: #182c32;
            background: #eef5f3;
            --accent: #176354;
            --line: #dbe7e3;
            --muted: #496268;
        }

        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }

        .topbar {
            background: #143c38;
            color: #fff;
        }

        .brand {
            max-width: 920px;
            margin: auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .brand img {
            width: 34px;
            height: 34px;
            padding: 5px;
            border-radius: 10px;
            background: #fff;
        }

        main {
            max-width: 920px;
            margin: 0 auto;
            padding: clamp(28px, 6vw, 68px) 24px;
        }

        .profile {
            overflow: hidden;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 18px 50px #143c3810;
        }

        .profile-header, .fields, .actions {
            padding: 24px clamp(18px, 5vw, 42px);
        }

        .profile-header {
            background: #f6fbf9;
            border-bottom: 1px solid var(--line);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.65rem, 4vw, 2.5rem);
            letter-spacing: -.035em;
        }

        .fields {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px 24px;
        }

        .field { display: grid; gap: 7px; min-width: 0; }
        .field label { color: var(--muted); font-size: .875rem; font-weight: 600; }

        .field input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #f7faf9;
            color: inherit;
            font: inherit;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid var(--line);
        }

        button {
            padding: 11px 18px;
            border: 1px solid #a5c5bc;
            border-radius: 9px;
            background: #fff;
            color: var(--accent);
            font: inherit;
            font-weight: 650;
            cursor: pointer;
        }

        button:hover { background: #e8f4ef; }
        :focus-visible { outline: 3px solid #408a79; outline-offset: 3px; }

        @media (max-width: 560px) {
            .fields { grid-template-columns: 1fr; gap: 16px; }
            .actions button { width: 100%; }
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="brand">
        <img th:src="@{/images/icon.ico}" alt="" width="34" height="34">
        <span>Электронная регистратура</span>
    </div>
</header>

<main>
    <form class="profile" th:action="@{/logout}" method="post" aria-labelledby="cabinet-title">
        <div class="profile-header">
            <h1 id="cabinet-title">Личный кабинет</h1>
        </div>

        <div class="fields">
            <div class="field">
                <label for="last-name">Фамилия</label>
                <input id="last-name" type="text" th:value="${cabinet.lastName}" readonly>
            </div>
            <div class="field">
                <label for="first-name">Имя</label>
                <input id="first-name" type="text" th:value="${cabinet.firstName}" readonly>
            </div>
            <div class="field">
                <label for="middle-name">Отчество</label>
                <input id="middle-name" type="text" th:value="${cabinet.middleName ?: '—'}" readonly>
            </div>
            <div class="field">
                <label for="login">Логин</label>
                <input id="login" type="text" th:value="${cabinet.login}" readonly>
            </div>
            <div class="field">
                <label for="role">Роль</label>
                <input id="role" type="text" th:value="${cabinet.role.name() == 'DOCTOR' ? 'Врач' : (cabinet.role.name() == 'PATIENT' ? 'Пациент' : 'Сотрудник регистратуры')}" readonly>
            </div>
            <div class="field">
                <label for="created-at">Дата регистрации</label>
                <input id="created-at" type="text" th:value="${#temporals.format(cabinet.createdAt, 'dd.MM.yyyy HH:mm')}" readonly>
            </div>
        </div>

        <div class="actions">
            <button type="submit">Выйти из аккаунта</button>
        </div>
    </form>
</main>
</body>
</html>
