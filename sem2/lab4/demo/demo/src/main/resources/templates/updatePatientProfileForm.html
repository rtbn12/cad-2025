<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Мои данные · Электронная регистратура</title><link rel="icon" th:href="@{/images/icon.ico}"><link rel="stylesheet" th:href="@{/styles/RegistrationStyle.css}"><link rel="stylesheet" th:href="@{/styles/ProfileUpdateStyle.css}"></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" th:href="@{/}"><img th:src="@{/images/icon.ico}" width="36" height="36" alt=""><h1>Электронная регистратура</h1></a><a th:href="@{/}">← В кабинет</a></div></header><main class="form-container"><div class="page-heading"><p>ЛИЧНЫЙ КАБИНЕТ / МОИ ДАННЫЕ</p><h2>Ваш профиль.<br>Всё актуально.</h2><p>Проверьте данные перед сохранением. Уже оформленные записи останутся за вами.</p></div><form class="registration-form" th:action="@{/updateProfileResult}" th:object="${updateForm}" method="post" onsubmit="return confirm('Вы проверили данные и хотите сохранить изменения?')"><div class="form-error" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p></div><div class="profile-grid"><div class="form-group"><label for="patientLastName">Фамилия</label><input id="patientLastName" type="text" th:field="*{patientLastName}" required ><p class="field-error" th:errors="*{patientLastName}"></p></div><div class="form-group"><label for="patientFirstName">Имя</label><input id="patientFirstName" type="text" th:field="*{patientFirstName}" required ><p class="field-error" th:errors="*{patientFirstName}"></p></div><div class="form-group"><label for="patientMiddleName">Отчество</label><input id="patientMiddleName" type="text" th:field="*{patientMiddleName}" ><p class="field-error" th:errors="*{patientMiddleName}"></p></div><div class="form-group"><label for="patientBirthday">Дата рождения</label><input id="patientBirthday" type="date" th:field="*{patientBirthday}" required ><p class="field-error" th:errors="*{patientBirthday}"></p></div><div class="form-group"><label for="patientOmsNumber">Номер ОМС</label><input id="patientOmsNumber" type="text" th:field="*{patientOmsNumber}" required ><p class="field-error" th:errors="*{patientOmsNumber}"></p></div><div class="form-group"><label for="patientPhone">Телефон</label><input id="patientPhone" type="tel" th:field="*{patientPhone}" required ><p class="field-error" th:errors="*{patientPhone}"></p></div></div><section class="password-section"><label class="password-toggle"><input id="change-password" type="checkbox" th:field="*{changePassword}"><span><strong>Изменить пароль</strong><small>Выключено — текущий пароль сохраняется.</small></span></label><p>От 10 до 72 символов: латиница, минимум одна заглавная буква и спецсимвол !@#$%^&*()_+=?.,:;~-; без пробелов</p><div class="profile-grid"><div class="form-group"><label for="new-password">Новый пароль</label><input id="new-password" type="password" name="patientNewPassword" autocomplete="new-password" placeholder="••••••••••" disabled></div><div class="form-group"><label for="confirm-password">Повторите новый пароль</label><input id="confirm-password" type="password" name="patientNewPasswordTwo" autocomplete="new-password" placeholder="••••••••••" disabled></div></div><noscript>Для переключения смены пароля включите JavaScript. Остальные данные можно сохранить без него.</noscript></section><div class="profile-actions"><a th:href="@{/}">Отмена</a><button type="submit">Сохранить изменения →</button></div></form></main><script th:src="@{/scripts/ProfilePassword.js}" defer></script></body></html>
