<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма для добавления новой задачи</title>
    <link rel="stylesheet" th:href="@{/styles/TaskListStyle.css}">
    <link rel="icon" th:href="@{/images/icon.ico}">
</head>
<body>
<header>
    <h1>Добавление новой задачи</h1>
</header>

<div class="form-container">
    <form name="AddTaskForm" method="post" th:action="@{/addTask}">

        <div class="form-group">
            <label for="title">Введите название задачи:</label>
            <input type="text" id="title" required name="title" maxlength="200" placeholder="Например: Заполнить карту">
        </div>

        <div class="form-group">
            <label for="description">Введите описание задачи:</label>
            <input type="text" id="description" required name="description" maxlength="600" placeholder="Например: Заполнить историю болезни пациента №123">
        </div>

        <div class="form-actions">
            <a th:href="@{/}" class="btn-cancel">Отмена</a>
            <button type="submit" class="btn-submit">Подтвердить</button>
        </div>

    </form>
</div>
</body>
</html>
